<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>중개센터 현장점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 한 손 조작 모바일 앱 — 상단 고정 바 + 단일 컬럼 카드 + 하단 고정 이동 버튼 */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#F5F7F5; --ink:#18221D; --muted:#5B6A62; --line:#D3DBD6;
  --accent:#1E5A43; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --ok:#23704A; --ok-soft:#DDF0E5; --warn:#9A5B00; --warn-soft:#FBEBCF; --q:#2F55A4; --q-soft:#E0E8F8;
  --crit:#B3261E; --crit-soft:#FBE0DE;
  --f-sans:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#18201C; --sunk:#1E2723; --ink:#E4EBE7; --muted:#9AA9A1; --line:#2D3833;
  --accent:#78C4A0; --accent-ink:#0E1A14; --accent-soft:#1F3A2E;
  --ok:#74C795; --ok-soft:#1C3527; --warn:#E3B061; --warn-soft:#3A2D16; --q:#94AEEB; --q-soft:#1E2943;
  --crit:#F28B82; --crit-soft:#3D1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#18201C; --sunk:#1E2723; --ink:#E4EBE7; --muted:#9AA9A1; --line:#2D3833;
  --accent:#78C4A0; --accent-ink:#0E1A14; --accent-soft:#1F3A2E;
  --ok:#74C795; --ok-soft:#1C3527; --warn:#E3B061; --warn-soft:#3A2D16; --q:#94AEEB; --q-soft:#1E2943;
  --crit:#F28B82; --crit-soft:#3D1F1D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px;min-height:56px}
.back{border:0;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.back:hover{background:var(--sunk)}
.bar h1{font-size:17px;font-weight:600;margin:0;line-height:1.3;min-width:0;flex:1;text-wrap:balance}
.bar .sub{font-size:12px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-t{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:14px 2px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.notice{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
/* 센터 목록 */
.center{display:flex;flex-direction:column;gap:10px}
.center h2{font-size:17px;margin:0;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none}
/* 영역 리스트 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 16px;min-height:60px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .no{font-size:18px;width:26px;flex:none;color:var(--accent);font-weight:600}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600}
.li .tx span{font-size:13px;color:var(--muted)}
.st{font-size:13px;font-weight:600;white-space:nowrap}
.st.done{color:var(--ok)} .st.part{color:var(--warn)} .st.none{color:var(--muted)}
.chev{color:var(--muted);flex:none}
/* 항목 화면 */
.steps{display:flex;gap:3px;margin:2px 0 4px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.j{background:var(--accent)} .steps i.cur{background:var(--ink)}
.it-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it-title{font-size:20px;font-weight:700;margin:4px 0 0;line-height:1.35;text-wrap:balance}
.crit-row{font-size:13px;color:var(--crit)}
.std{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0 0}
.std .lb{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.std p{margin:2px 0 0}
details.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:36px;display:flex;align-items:center}
dl.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;margin:6px 0 0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
.guide{display:grid;gap:4px;font-size:13px;margin-top:6px}
.guide div{display:flex;gap:8px} .guide b{flex:none;width:18px;text-align:center}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fields .full{grid-column:1/-1}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fld input[type=number],.fld input[type=text],.fld input[type=date],.fld select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:10px 12px}
.fld .unit{position:relative}
.fld .unit input{padding-right:46px}
.fld .unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;border:0;background:none;min-height:42px;font-size:13px;padding:4px 6px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.calc{font-size:14px;color:var(--muted)} .calc b{color:var(--ink);font-size:18px}
.warns{display:grid;gap:8px}
.w{border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.w .tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;flex:none;margin-top:2px}
.w.warn{background:var(--warn-soft);color:var(--warn)} .w.warn .tag{background:var(--warn);color:var(--surface)}
.w.check{background:var(--q-soft);color:var(--q)} .w.check .tag{background:var(--q);color:var(--surface)}
.w.info{background:var(--sunk);color:var(--muted)} .w.info .tag{background:var(--line);color:var(--ink)}
.w.crit{background:var(--crit-soft);color:var(--crit)} .w.crit .tag{background:var(--crit);color:var(--surface)}
.judge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jb{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:14px}
.jb .sym{font-size:24px;line-height:1}
.jb.o[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.jb.w2[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.jb.q[aria-pressed="true"]{background:var(--q);border-color:var(--q);color:var(--surface)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
.hint{font-size:13px;color:var(--warn);margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.dock .btn{flex:1}
.dock .btn.sm{flex:0 0 96px}
/* 사전자료 */
.doc{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
/* 결과 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile.o b{color:var(--ok)} .tile.w2 b{color:var(--warn)} .tile.q b{color:var(--q)}
table.b14{width:100%;border-collapse:collapse;font-size:14px}
table.b14 th,table.b14 td{padding:10px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
table.b14 tr:first-child th,table.b14 tr:first-child td{border-top:0}
table.b14 th{font-weight:500}
table.b14 small{display:block;color:var(--muted);font-size:12px;font-weight:400}
table.b14 select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:4px 6px;width:100%}
.fi{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0;padding-top:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.lock{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.confirm-box{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.confirm-box .btns{display:flex;gap:8px}
.confirm-box .btn{flex:1;min-height:44px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;min-height:36px}
.tabs{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:560px;margin:0 auto;display:flex;gap:4px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px}
.tab{flex:none;border:0;background:none;border-radius:10px;min-height:40px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .tb{font-family:var(--f-mono);font-size:11px;font-weight:500;opacity:.85}
.tab .tb.done{color:var(--ok)} .tab[aria-current="true"] .tb{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;align-items:center}
.legend b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;margin-right:4px;font-size:13px}
.lo{background:var(--ok-soft);color:var(--ok)} .lw{background:var(--warn-soft);color:var(--warn)} .lq{background:var(--q-soft);color:var(--q)}
.qlist{display:flex;flex-direction:column;gap:10px}
.q-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--line)}
.q-row.j-o{border-left-color:var(--ok)} .q-row.j-w{border-left-color:var(--warn)} .q-row.j-q{border-left-color:var(--q)}
.q-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q-head .kw{font-size:13px;color:var(--muted);font-weight:500}
.q-txt{margin:0;font-size:17px;font-weight:600;line-height:1.45;text-wrap:pretty}
.q-mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--surface);font-size:12px;font-family:var(--f-mono);margin-right:8px;vertical-align:2px}
.q-row .std{margin:0;background:var(--sunk);border-radius:0 10px 10px 0;padding:8px 12px}
.q-row .std p{margin:2px 0 0;font-size:14px}
.q-row .std .std-key{font-weight:600;color:var(--accent);margin-top:4px}
.exp{align-self:flex-start;border:0;background:none;min-height:40px;padding:4px 2px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.q-judge{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.jl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;flex:none}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.mj{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.mj span{font-size:20px;font-weight:600}
.mj small{font-size:12px;font-weight:600}
.mj.o[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mj.w2[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.mj.q[aria-pressed="true"]{background:var(--q);border-color:var(--q);color:var(--surface)}
.q-panel{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.q-panel .std p{margin:4px 0 0}
.doc span{font-weight:500}
.rep-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rep{padding:16px 12px;font-size:12.5px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
[data-copyrep]{white-space:nowrap;flex:none}
.rep-t{font-size:17px;text-align:center;margin:0 0 2px}
.rep-s{text-align:center;color:var(--muted);margin:0 0 10px;font-size:12px}
.rep h3{font-size:14px;margin:16px 0 6px}
.rep h3 small{font-weight:400;color:var(--muted)}
.rep table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rep th,.rep td{border:1px solid var(--line);padding:5px 7px;vertical-align:middle;text-align:left}
.rep th{background:var(--sunk);font-weight:600}
.rep td.c{text-align:center} .rep td.n{text-align:right}
.rep-box{border:1px solid var(--line);padding:10px;white-space:pre-wrap}
.rep td small{display:block;color:var(--muted);font-size:11px}
label.btn{cursor:pointer;text-align:center}
.rep-sign{text-align:right;margin:18px 0 0}
@media (max-width:380px){.fields{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.jb,.li{transition:background-color .12s,border-color .12s}}
.std-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 6px}
.brow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow-h{display:flex;justify-content:space-between;align-items:center}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.gb{min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15}
.gb small{font-size:10px;font-weight:700;color:var(--accent);border:1px dashed var(--accent);border-radius:5px;padding:0 4px}
.gb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gb[aria-pressed="true"] small{color:var(--accent-ink);border-color:var(--accent-ink)}
.dorm-row{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.dorm-row .fld label{display:none}
.rep .pre{white-space:pre-wrap}
.rep table{margin-bottom:8px}
</style>

<script>
(() => {
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const fmt = n => n == null ? '-' : Number(n).toLocaleString('ko-KR');
const r1 = x => Math.round(x * 10) / 10;
const pct = (a,b) => (a!=null && b) ? r1(a/b*100) : null;

/* ── 기준치 (’26년 농촌인력중개센터 시행지침, 2026. 9.) ── */
const STD = {
  ratioCenter: 40, ratioCenterSido: 60,          // 센터운영비 편성 상한(%) p.9
  eduUnit: 20000, eduDays: 3, eduDaySum: 100000, // 신규 구직자 교육비 p.8
  transNear: 10000, transFar: 20000, transFarm: 20000, // 교통비 p.8
  lodge: 30000, lodgeDays: 3,                    // 숙박비 p.8
  snack: 5000, lead: 10000,                      // 간식비 p.8, 작업반장 p.9·26
  durable: 500000,                               // 내구성물품 p.10
  posts: 2, teamMin: 3,                          // 플랫폼 공고 월 2회, 작업반 3명 p.6
  pubRateCut: 30, pubRateCut2: 50,               // 공공형 집행률 p.14
  wage: 10320, econ: 30, feeAll: 20, feeRoom: 15, room: 2.5, leadPer: 10 // 공공형 p.22~24

/* ── 자동 점검 ── */
function checks(c){
  const v = S[c.id].v, out = [];
  const add = (cat, lv, text, ref) => out.push({cat, lv, text, ref});
  const pub = c.type==='public';
  // 인력 요건
  const st = num(v.staff), sp = num(v.support);
  if(st!=null && st<1) add('plan','warn','전담인력이 없습니다(1명 이상 필요).','p.20');
  if(!pub && sp!=null && sp<1) add('plan','warn','운영 지원인력이 없습니다(1명 이상 필요).','p.20');
  // 예산
  const P = k => num(v['p_'+k]), E = k => num(v['e_'+k]);
  const sumP = BROWS.reduce((t,[k])=>t+(P(k)||0),0), sumE = BROWS.reduce((t,[k])=>t+(E(k)||0),0);
  const cenP = ['c1','c2','c3','c4'].reduce((t,k)=>t+(P(k)||0),0);
  const lim = c.sub==='시도형'?STD.ratioCenterSido:STD.ratioCenter;
  if(sumP>0 && cenP/sumP*100 > lim+0.05) add('plan','warn',`센터운영비 편성비율 ${r1(cenP/sumP*100)}% — 기준 ${lim}% 초과`,'p.9');
  const bt = num(v.bud_total), bn = num(v.bud_nat), bl = num(v.bud_loc);
  if(bn!=null && bl!=null && bl < bn) add('fund','warn',`지방비(${fmt(bl)}백만원)가 국비(${fmt(bn)}백만원)보다 적습니다(국비·지방비 각 50%)`,'p.2');
  if(bt!=null && bn!=null && bl!=null && Math.abs(bt-(bn+bl))>0.5) add('fund','check','예산 합계가 국비+지방비와 다릅니다','');
  if(bt && sumP>0 && Math.abs(bt*1000-sumP)>bt*10) add('fund','check',`세부항목 예산계획 합계(${fmt(sumP)}천원)가 센터 예산(${fmt(bt*1000)}천원)과 다릅니다`,'');
  const noEv = BROWS.filter(([k])=>(E(k)||0)>0 && !v['ev_'+k]).map(([,g,n])=>n+(n==='기타'?`(${g==='센터운영비'?'센터':'인력'})`:''));
  if(noEv.length) add('fund','check',`증빙 미확인: ${noEv.join(', ')}`,'p.16');
  if(pub && ((P('h2')||0)>0 || (E('h2')||0)>0)) add('fund','check','공공형 지침에는 농작업 참여비 항목이 없습니다. 집행 내용을 확인하세요','p.25');
  if(sumP>0 && v.e_any!==false){
    const rate = sumE/sumP*100;
    if(pub && sumE>0){ if(rate<STD.pubRateCut) add('fund','warn',`집행률 ${r1(rate)}% — 30% 미만(차년도 선정 제외 사유)`,'p.14'); else if(rate<STD.pubRateCut2) add('fund','warn',`집행률 ${r1(rate)}% — 50% 미만(차년도 최대 20% 감액 가능)`,'p.14'); }
  }
  // 단가
  if(!pub){
    const lim2 = v.u_trans_dist==='30km 미만'?STD.transNear:v.u_trans_dist?STD.transFar:null;
    if(lim2 && num(v.u_trans)>lim2) add('fund','warn',`교통비 ${fmt(num(v.u_trans))}원 — 기준 ${fmt(lim2)}원 초과`,'p.8');
    if(num(v.u_lodge)>STD.lodge) add('fund','warn',`숙박비 ${fmt(num(v.u_lodge))}원 — 기준 30,000원 초과`,'p.8');
    if(v.u_lodge_out==='조건 미충족 건 있음') add('fund','warn','숙박비 지급 조건(관외·3일 이상 연속) 미충족 건','p.8');
    if(num(v.u_snack)>STD.snack) add('fund','warn',`간식비 ${fmt(num(v.u_snack))}원 — 기준 5,000원 초과`,'p.8');
    if(num(v.u_edu)>STD.eduUnit) add('fund','warn',`교육비 1인 1일 ${fmt(num(v.u_edu))}원 — 기준 20,000원 초과`,'p.8');
    if(num(v.u_edu_days)>STD.eduDays) add('fund','warn',`교육비 지급 ${num(v.u_edu_days)}일 — 기준 3일 초과`,'p.8');
    if(v.f_dup) add('fund','warn','숙박비·교통비 같은 날 중복 지급','p.8');
  } else if(v.f_farmcar) add('fund','warn','농가 제공 교통편은 운송비 지원 제한','p.25');
  if(num(v.u_lead)>STD.lead) add('fund','warn',`작업반장 수당 ${fmt(num(v.u_lead))}원 — 기준 10,000원 초과`,'p.9');
  if(v.f_nh) add('fund','warn','농협 직원 인건비는 전담인력 인건비로 집행 불가','p.7');
  if(v.f_durable) add('fund','warn','내구성물품(50만원 이상) 구입은 지원 불가','p.10');
  if(v.f_capital) add('fund','crit','토지·건물 등 자본지출은 지원 불가','p.10');
  if(v.f_change) add('fund','warn','사전승인 없는 예산 변경','p.9');
  if(v.f_meet) add('fund','check','간담회 증빙(회의록·서명·사진) 보완 필요','p.10');
  // 사업계획
  if(v.plan_ok==='일부 미달') add('plan','check','사업계획 대비 운영 실적 일부 미달','');
  if(v.plan_ok==='크게 미달') add('plan','warn','사업계획 대비 운영 실적 크게 미달','');
  const tm = num(v.teams), tp = num(v.team_people);
  if(!pub && tm && tp!=null && tp/tm < STD.teamMin) add('plan','warn',`영농작업반 평균 ${r1(tp/tm)}명 — 최소 3명 미달`,'p.6');
  if(pub && tm && num(v.current) && num(v.current)/tm > STD.leadPer) add('worker','check',`작업반장 1명당 계절노동자 ${r1(num(v.current)/tm)}명 — 5~10명당 1명 권장`,'p.24');
  // 중개실적
  if(num(v.posts)!=null && num(v.posts)<STD.posts) add(pub?'plan':'match','warn',`플랫폼 구인공고 월 ${num(v.posts)}회 — 기준 2회 미달`,'p.6');
  const sn = num(v.smp_n), so = num(v.smp_ok);
  if(sn && so!=null && so<sn) add(pub?'plan':'match','warn',`표본 ${sn}건 중 ${sn-so}건 플랫폼 기록 불일치`,'p.6');
  if(v.plat_in==='일부 누락') add(pub?'plan':'match','check','중개결과 플랫폼 입력 일부 누락','p.6');
  if(v.plat_in==='미입력') add(pub?'plan':'match','warn','중개결과 플랫폼 미입력(입력 필수)','p.6');
  if(v.consent==='일부 누락') add(pub?'plan':'match','check','참여 신청서·개인정보 동의서 일부 누락','p.44~47');
  // 복무
  if(v.contract==='미확인') add('staff','warn','전담인력 근로계약서 미확인','');
  if(v.edu==='일부 미이수') add('staff','check','담당자 교육 일부 미이수','p.7');
  if(v.edu==='미이수') add('staff','warn','담당자 교육 미이수','p.7');
  if(v.travel==='일부 부적정') add('staff','warn','출장비 공무원 여비 기준 미준수','별표 5');
  // 공공형
  if(pub){
    if(num(v.wage)!=null && num(v.wage)<STD.wage) add('worker','crit',`시급 ${fmt(num(v.wage))}원 — 최저임금 10,320원 미만`,'p.22');
    if(v.slip==='미교부') add('worker','warn','임금명세서 미교부','p.23');
    if(num(v.econ)>STD.econ) add('worker','warn',`경제사업장 노동 ${num(v.econ)}% — 기준 30% 초과`,'p.22');
    if(v.tip==='2개월 경과 미제출') add('worker','warn','인신매매 식별지표 조사 기한(채용 후 2개월) 경과','p.24');
    if(v.passport==='타인 보관 의심') add('worker','crit','여권·통장 타인 보관 의심(형사처벌 대상)','p.24');
    if(v.insure==='일부 미가입') add('worker','warn','산재·건강보험 일부 미가입','p.23');
    const ord=num(v.ord), fee=num(v.fee);
    if(ord && fee!=null){ const l=v.fee_mode==='숙소만'?STD.feeRoom:STD.feeAll; if(fee/ord*100>l) add('dorm','warn',`숙식비 공제 ${r1(fee/ord*100)}% — 기준 ${l}% 초과`,'p.23'); }

/* ── 파일 저장·불러오기·모아보기 ── */
function download(name, text, mime){
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); toast('파일을 저장했습니다. 다운로드 폴더를 확인하세요'); }
  catch(e){ toast('이 환경에서는 파일 저장이 막혀 있습니다'); }
}
const safe = s => String(s).replace(/[\\/:*?"<>|\s]+/g,'_');
const csv = v => { const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
function summary(c){
  const st=S[c.id], {all}=budgetCalc(c), ch=checks(c).filter(e=>e.lv!=='info');
  return {rate:pct(all[1],all[0]), grades:Object.fromEntries(CATS[c.type].map(([k,l])=>[l,st.g[k]||''])), errors:ch.map(e=>({lv:e.lv,text:e.text,cat:(CATS[c.type].find(x=>x[0]===e.cat)||[])[1]||''}))};
}
function exportJson(c){ download(`점검결과_${safe(c.name)}_${safe(c.date)}.json`, JSON.stringify({app:'jungae-check', ver:2, savedAt:new Date().toISOString(), center:c, state:S[c.id], summary:summary(c)},null,1), 'application/json'); }
function exportCsv(c){
  const st=S[c.id], sm=summary(c); const rows=[['구분','항목','값·판정','비고']];
  rows.push(['센터',c.name,`${c.typeL}${c.sub?' '+c.sub:''}`,`점검일 ${c.date} / 확정 ${st.confirmedAt||'미확정'}`]);
  BROWS.forEach(([k,g,n])=>rows.push(['예산',`${g} ${n}`,`${st.v['p_'+k]??''} / ${st.v['e_'+k]??''}`,st.v['ev_'+k]?'증빙 확인':'']));
  rows.push(['예산','전체 집행률',sm.rate!=null?sm.rate+'%':'','']);
  CATS[c.type].forEach(([k,l])=>rows.push(['점검사항',l,st.g[k]||'',st.memo[k]||'']));
  sm.errors.forEach(e=>rows.push(['자동점검',e.cat,LV[e.lv][0],e.text]));
  rows.push(['현장 의견','','',st.opinion||'']);
  download(`점검결과_${safe(c.name)}_${safe(c.date)}.csv`, '﻿'+rows.map(r=>r.map(csv).join(',')).join('\r\n'), 'text/csv');
}
function readJson(files, cb){ const out=[]; let n=files.length; if(!n) return; [...files].forEach(f=>{ const fr=new FileReader(); fr.onload=()=>{ try{ const p=JSON.parse(fr.result); if(p.app==='jungae-check'&&p.ver===2) out.push(p);}catch(e){} if(--n===0) cb(out); }; fr.onerror=()=>{ if(--n===0) cb(out); }; fr.readAsText(f); }); }

    else if(L==='budget') el.innerHTML=liveBudget(c);
    else if(L.startsWith('r-')){ const k=L.slice(2), v=S[c.id].v, x=pct(num(v['e_'+k]),num(v['p_'+k])); el.textContent=x!=null?x+'%':''; }
    else if(L.startsWith('cat-')){ el.innerHTML=errHtml(all.filter(e=>e.cat===L.slice(4))); }
  });
  if(V.tab==='cats') CATS[c.type].forEach(([k])=>{ if(k==='will') return; const sg=suggest(all.filter(e=>e.cat===k));
    document.querySelectorAll(`[data-grade="${k}"]`).forEach(b=>{ const s=b.querySelector('small'); if(b.dataset.val===sg){ if(!s) b.insertAdjacentHTML('beforeend','<small>제안</small>'); } else if(s) s.remove(); }); });
}
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }

app.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset; const c=cur();
  if(d.go==='home'){ V={name:'home'}; ASK=''; return render(); }
  if(d.go==='result'){ V={name:'work',cid:c.id,tab:'result'}; return render(); }
  if(d.ask!==undefined){ ASK=d.ask; return render(true); }
  if(d.open){ V={name:'work',cid:d.open,tab:S[d.open].confirmed?'result':'info'}; ASK=''; return render(); }
  if(d.tab){ V={name:'work',cid:c.id,tab:d.tab}; ASK=''; return render(); }
  if(d.reset==='go'){ S=seed(); ASK=''; save(); toast('예시 센터로 되돌렸습니다'); return render(); }
  if(d.add){ V={name:'add'}; return render(); }
  if(d.agg){ V={name:'agg'}; return render(); }
  if(d.report){ V={name:'report',cid:c.id}; return render(); }
  if(d.copyrep) return copyReport();
  if(d.addseg){ const dr=S.__draft; ['name','date'].forEach(k=>{const el=document.getElementById('a-'+k); if(el) dr[k]=el.value;}); dr[d.addseg]=d.val; save(); return render(true); }
  if(d.addsave){ const dr=S.__draft; ['name','date'].forEach(k=>{const el=document.getElementById('a-'+k); if(el) dr[k]=el.value.trim();});
    if(!dr.name){ toast('센터명을 입력하세요'); return; } const type=dr.type==='공공형'?'public':'rural';
    const nc={id:'c'+Date.now(), name:dr.name, type, typeL:dr.type, sub:type==='rural'?dr.sub:'', op:dr.op, date:dr.date||'', prior:[]};
    centers().push(nc); S[nc.id]=blank(); delete S.__draft; save(); toast('센터를 등록했습니다'); V={name:'home'}; return render(); }
  if(d.delc==='go'){ S.__c=centers().filter(x=>x.id!==c.id); delete S[c.id]; ASK=''; save(); V={name:'home'}; toast('삭제했습니다'); return render(); }
  if(d.prior){ S[c.id].prior[d.prior]=d.val; save(); return render(true); }
  if(d.seg){ if(S[c.id].confirmed) return; const v=S[c.id].v; v[d.seg]= v[d.seg]===d.val?'':d.val; save();
    b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.val===v[d.seg]))); return live(); }
  if(d.grade){ if(S[c.id].confirmed) return; const g=S[c.id].g; g[d.grade]= g[d.grade]===d.val?'':d.val; save(); return render(true); }
  if(d.draft){ S[c.id].opinion=draftOpinion(c); save(); return render(true); }
  if(d.confirm==='go'){ const st=S[c.id], n=new Date(); st.confirmed=true; st.confirmedAt=`${n.getMonth()+1}.${n.getDate()}. ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; ASK=''; save(); toast('확정했습니다'); return render(true); }
  if(d.expjson) return exportJson(c);
  if(d.expcsv) return exportCsv(c);
  if(d.aggcsv) return aggCsv();
  if(d.aggclear){ AGG=[]; return render(); }
});
app.addEventListener('input', e=>{
  const t=e.target, c=cur(); if(!c) return; const st=S[c.id];
  if(t.dataset.k){ if(st.confirmed) return; st.v[t.dataset.k] = t.type==='checkbox'?t.checked:t.value; save(); return live(); }
  if(t.dataset.memo){ st.memo[t.dataset.memo]=t.value; save(); return; }
  if(t.dataset.opinion){ st.opinion=t.value; save(); return; }
  if(t.dataset.insp){ st.insp[t.dataset.insp]=t.value; save(); return; }
});
app.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.aggfiles){ readJson(t.files, list=>{ list.forEach(p=>{ const i=AGG.findIndex(x=>x.center.id===p.center.id); i<0?AGG.push(p):AGG.splice(i,1,p); }); toast(`${list.length}개 파일을 불러왔습니다`); render(true); }); return; }
  const c=cur(); if(!c) return;
  if(t.dataset.importprev){ readJson(t.files, list=>{ const p=list[0]; if(!p){ toast('점검 결과 파일이 아닙니다'); return; }
    const bad=Object.entries(p.summary.grades).filter(([,g])=>g==='미흡'||g==='매우 미흡').map(([l,g])=>({y:p.center.date,t:`${l} ${g}`}));
    const errs=p.summary.errors.filter(e=>e.lv!=='check').map(e=>({y:p.center.date,t:e.text}));
    c.prior=[...bad,...errs]; S[c.id].prior={}; save(); toast(`지난 지적사항 ${c.prior.length}건을 불러왔습니다`); render(true); }); return; }
  if(t.dataset.k && t.type==='checkbox'){ S[c.id].v[t.dataset.k]=t.checked; save(); live(); }
});
render();
})();
</script>
