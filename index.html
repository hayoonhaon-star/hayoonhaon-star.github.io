<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>외국인근로자 기숙사 건립지원사업 전문가 상담 플랫폼 — DEMO</title>
<style>
:root{--blue:#1d4ed8;--blue2:#2563eb;--navy:#0f172a;--bg:#f5f7fb;--line:#e5e7eb;--muted:#64748b;--green:#15803d;--amber:#b45309;--red:#b91c1c;--card:#fff;--shadow:0 8px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:#111827} button,input,textarea,select{font:inherit}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);display:grid;place-items:center;color:#fff;font-weight:900}.demo-badge{font-size:12px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;padding:4px 8px;border-radius:999px;margin-left:4px}.rightbar{display:flex;align-items:center;gap:10px}.role-switch{display:flex;background:#f1f5f9;border-radius:10px;padding:3px}.role-switch button{border:0;background:transparent;padding:8px 10px;border-radius:8px;color:#475569;cursor:pointer}.role-switch button.active{background:#fff;color:#0f172a;box-shadow:0 1px 5px rgba(15,23,42,.12)}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}.sidebar{background:#0f172a;color:#cbd5e1;padding:20px 14px}.sidebar h4{font-size:12px;text-transform:uppercase;color:#94a3b8;margin:14px 12px 8px;letter-spacing:.08em}.menu{display:flex;flex-direction:column;gap:4px}.menu button{width:100%;text-align:left;background:transparent;color:#cbd5e1;border:0;padding:11px 12px;border-radius:9px;cursor:pointer}.menu button.active,.menu button:hover{background:#1e293b;color:#fff}.sidebar .seat{margin:16px 8px 0;padding:12px;border:1px solid #334155;border-radius:10px;font-size:13px;line-height:1.5}.main{padding:24px;max-width:1500px;width:100%;margin:0 auto}.page{display:none}.page.active{display:block}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.page-title h1{font-size:24px;margin:0 0 6px}.page-title p{margin:0;color:var(--muted);font-size:14px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#e2e8f0;color:#0f172a}.btn-ghost{background:#fff;border:1px solid var(--line);color:#334155}.btn-danger{background:#fee2e2;color:#991b1b}.btn-small{padding:7px 10px;font-size:13px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:28px;font-weight:800;margin-top:6px}.stat .sub{font-size:12px;color:#64748b;margin-top:5px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}.card h3{margin:0 0 14px;font-size:17px}.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.chart{height:190px;display:flex;align-items:flex-end;gap:12px;padding:8px 8px 26px;border-bottom:1px solid var(--line);position:relative}.bar{flex:1;background:linear-gradient(#60a5fa,#2563eb);border-radius:6px 6px 0 0;min-height:10px;position:relative}.bar span{position:absolute;bottom:-22px;font-size:11px;color:#64748b;left:50%;transform:translateX(-50%)}
.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:#64748b;background:#f8fafc}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}.s-new{background:#dbeafe;color:#1d4ed8}.s-wait{background:#fef3c7;color:#92400e}.s-progress{background:#dcfce7;color:#166534}.s-done{background:#e2e8f0;color:#475569}.s-over{background:#fee2e2;color:#991b1b}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:#fff;margin:2px}
.notice{padding:12px 14px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:13px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 11px;background:#fff}.field textarea{min-height:120px;resize:vertical}.faq-suggest{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;margin:12px 0}.faq-suggest strong{display:block;margin-bottom:6px}.faq-item{padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.chat-shell{display:grid;grid-template-columns:340px 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-height:650px}.chat-list{border-right:1px solid var(--line);background:#fbfdff}.chat-list-header{padding:15px;border-bottom:1px solid var(--line)}.chat-item{padding:14px 15px;border-bottom:1px solid var(--line);cursor:pointer}.chat-item.active{background:#eff6ff}.chat-item .top{display:flex;justify-content:space-between;gap:8px}.chat-item .title{font-weight:800;font-size:14px}.chat-item .preview{font-size:12px;color:#64748b;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-room{display:flex;flex-direction:column;min-width:0}.chat-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-meta{font-size:12px;color:#64748b;margin-top:4px}.messages{flex:1;padding:18px;background:#f8fafc;overflow:auto;min-height:430px}.date-sep{text-align:center;color:#94a3b8;font-size:11px;margin:8px 0 14px}.msg{display:flex;margin:10px 0}.msg.me{justify-content:flex-end}.bubble-wrap{max-width:72%}.sender{font-size:11px;color:#64748b;margin-bottom:4px}.bubble{padding:11px 13px;border-radius:14px;background:#fff;border:1px solid #e2e8f0;line-height:1.5;font-size:14px}.msg.me .bubble{background:#2563eb;color:#fff;border-color:#2563eb}.meta{font-size:10px;color:#94a3b8;margin-top:4px}.msg.me .meta{text-align:right}.system{text-align:center;font-size:11px;color:#64748b;margin:10px 0}.attach-card{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}.inputbar{border-top:1px solid var(--line);padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;background:#fff}.inputbar input{border:1px solid #cbd5e1;border-radius:9px;padding:10px}.toolrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.unread{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800}
.phone{max-width:430px;margin:0 auto;background:#fff;border:10px solid #111827;border-radius:34px;box-shadow:0 18px 45px rgba(15,23,42,.18);overflow:hidden}.phone-top{height:28px;background:#111827}.phone-screen{min-height:670px;background:#f8fafc}.mobile-head{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.mobile-body{padding:14px}.mobile-list .chat-item{background:#fff;border-radius:12px;margin-bottom:10px;border:1px solid var(--line)}.fab{position:absolute;right:26px;bottom:28px;width:56px;height:56px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-size:28px;box-shadow:0 10px 25px rgba(37,99,235,.35);cursor:pointer}.phone-wrap{position:relative;max-width:430px;margin:0 auto}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 25px 70px rgba(15,23,42,.3)}.modal h2{margin-top:0}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.step{font-size:12px;text-align:center;padding:9px 6px;background:#f1f5f9;border-radius:8px}.step.active{background:#dbeafe;color:#1d4ed8;font-weight:800}.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);display:none;z-index:60;font-size:13px}.toast.show{display:block}.muted{color:#64748b}.kpi-note{font-size:12px;color:#64748b}.empty{padding:40px;text-align:center;color:#64748b}.section-gap{margin-top:16px}.danger-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:9px;font-size:12px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{display:none}.grid-4{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.chat-shell{grid-template-columns:1fr}.chat-list{display:none}.main{padding:14px}.topbar{padding:0 12px}.brand .name{display:none}.role-switch button{padding:7px 8px;font-size:12px}}
@media(max-width:600px){.grid-4{grid-template-columns:1fr 1fr}.stat .value{font-size:22px}.form-row{grid-template-columns:1fr}.main{padding:10px}.page-title h1{font-size:21px}.role-switch{overflow:auto;max-width:72vw}.topbar{height:auto;min-height:58px;gap:8px;align-items:center}.rightbar{width:100%;justify-content:flex-end}.brand{min-width:max-content}.chat-shell{min-height:calc(100vh - 140px);border-radius:0}.chat-head{padding:10px}.bubble-wrap{max-width:86%}.messages{min-height:55vh}.phone{border-width:6px;border-radius:24px}.phone-screen{min-height:620px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">EP</div><div class="name">외국인근로자 기숙사 건립지원사업 전문가 상담 플랫폼</div><span class="demo-badge">DEMO</span></div>
  <div class="rightbar"><div class="role-switch" id="roleSwitch">
    <button data-role="admin" class="active">농정원 관리자</button><button data-role="officer">지자체 담당자</button><button data-role="expert">건축전문가</button>
  </div></div>
</div>
<div class="layout">
  <aside class="sidebar"><div class="seat" id="seatCard">농정원 관리자<br><span class="muted">EPIS-ADMIN-01</span></div><h4>업무 메뉴</h4><div class="menu" id="menu"></div></aside>
  <main class="main">
    <section class="page active" id="admin-dashboard"></section>
    <section class="page" id="admin-invites"></section>
    <section class="page" id="admin-faq"></section>
    <section class="page" id="officer-home"></section>
    <section class="page" id="officer-new"></section>
    <section class="page" id="officer-chat"></section>
    <section class="page" id="expert-home"></section>
    <section class="page" id="expert-chat"></section>
  </main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const state={
 role:'admin',
 activePage:'admin-dashboard',
 inviteIssued:false,
 consultationCreated:false,
 followup:false,
 completed:false,
 faqPublished:false,
 notifications:{admin:2,officer:1,expert:0},
 messages:[
   {who:'officer',name:'완주군 기숙사 담당자',text:'기숙사 리모델링 설계안에서 2층 피난동선과 계단 폭이 적정한지 검토 부탁드립니다. 현장 사진도 함께 첨부합니다.',time:'10:12',file:'현장사진_계단.jpg'},
   {who:'expert',name:'건축전문가 김OO',text:'도면과 사진 기준으로는 2층 피난동선 추가 확인이 필요합니다. 계단 유효폭과 출입구 방향을 확인할 수 있는 평면도를 추가로 보내주세요.',time:'10:28'},
 ]
};
const menus={
 admin:[['admin-dashboard','대시보드'],['admin-invites','계정·초대 관리'],['admin-faq','FAQ 후보함']],
 officer:[['officer-home','상담 목록'],['officer-new','새 상담 등록'],['officer-chat','상담 채팅방']],
 expert:[['expert-home','배정 상담'],['expert-chat','상담 채팅방']]
};
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function setRole(role){state.role=role;document.querySelectorAll('#roleSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));state.activePage=role==='admin'?'admin-dashboard':role==='officer'?'officer-home':'expert-home';renderAll();}
function navigate(id){state.activePage=id;renderAll();}
function renderMenu(){const m=document.getElementById('menu');m.innerHTML=menus[state.role].map(([id,label])=>`<button class="${state.activePage===id?'active':''}" onclick="navigate('${id}')">${label}</button>`).join('');const seat=document.getElementById('seatCard');seat.innerHTML=state.role==='admin'?'농정원 관리자<br><span class="muted">EPIS-ADMIN-01</span>':state.role==='officer'?'완주군 기숙사 담당자<br><span class="muted">WANJU-SEAT-01</span>':'건축전문가<br><span class="muted">EXPERT-ARCH-01</span>';}
function pageHeader(title,sub,actions=''){return `<div class="page-header"><div class="page-title"><h1>${title}</h1><p>${sub}</p></div><div>${actions}</div></div>`}
function renderAdminDashboard(){const c=state.consultationCreated?13:12;return pageHeader('관리자 대시보드','사업 전체 상담 현황과 처리 지연, 주요 상담내용을 한눈에 확인','<button class="btn btn-ghost btn-small" onclick="showDemoGuide()">시연 가이드</button>')+`
<div class="grid-4"><div class="stat"><div class="label">전체 상담</div><div class="value">${c}</div><div class="sub">이번 달 +${state.consultationCreated?4:3}</div></div><div class="stat"><div class="label">답변 대기</div><div class="value">${state.completed?1:2}</div><div class="sub">SLA 2영업일 기준</div></div><div class="stat"><div class="label">진행 중</div><div class="value">${state.completed?3:4}</div><div class="sub">추가자료 요청 포함</div></div><div class="stat"><div class="label">FAQ 검토대기</div><div class="value">${state.faqPublished?1:2}</div><div class="sub">전문가 추천 건</div></div></div>
<div class="two-col section-gap"><div class="card"><h3>월별 상담 추이</h3><div class="chart"><div class="bar" style="height:42%"><span>5월</span></div><div class="bar" style="height:56%"><span>6월</span></div><div class="bar" style="height:50%"><span>7월</span></div><div class="bar" style="height:69%"><span>8월</span></div><div class="bar" style="height:61%"><span>9월</span></div><div class="bar" style="height:${state.consultationCreated?'88':'76'}%"><span>10월</span></div></div><div class="kpi-note">※ 가상데이터 기반 시연화면</div></div><div class="card"><h3>상위 상담 키워드</h3><div><span class="pill">피난동선 8</span><span class="pill">계단 7</span><span class="pill">소방 6</span><span class="pill">설계변경 5</span><span class="pill">예산 4</span><span class="pill">불법증축 3</span></div><h3 style="margin-top:18px">평균 최초답변</h3><div style="font-size:30px;font-weight:800">5시간 42분</div><div class="muted" style="font-size:12px">영업시간 기준 가상값</div></div></div>
<div class="card section-gap"><div class="split"><h3>미답변·지연 상담</h3><button class="btn btn-secondary btn-small" onclick="exportDemo()">Excel 다운로드 데모</button></div><table class="table"><thead><tr><th>상담번호</th><th>지자체</th><th>사업장</th><th>유형</th><th>상태</th><th>경과</th></tr></thead><tbody><tr><td>2026-0012</td><td>김천시</td><td>농업인력 기숙사</td><td>계약·시공</td><td><span class="status s-over">기한초과</span></td><td>2일 7시간</td></tr>${state.consultationCreated?'<tr><td>2026-0013</td><td>완주군</td><td>완주 외국인근로자 기숙사</td><td>설계</td><td><span class="status s-wait">진행 중</span></td><td>방금 등록</td></tr>':''}</tbody></table></div>`}
function renderInvites(){return pageHeader('계정·초대 관리','조직 좌석계정과 일회성 초대코드 발급·승인 관리',`<button class="btn btn-primary" onclick="issueInvite()">초대코드 발급</button>`)+`<div class="notice">담당자 개인 이름·전화번호 없이 조직 좌석 단위로 운영하는 시연입니다.</div><div class="card section-gap"><h3>좌석계정</h3><table class="table"><thead><tr><th>조직/역할</th><th>좌석 ID</th><th>상태</th><th>기기</th><th>최근접속</th></tr></thead><tbody><tr><td>완주군 / 담당자</td><td>WANJU-SEAT-01</td><td><span class="status s-progress">활성</span></td><td>iPhone 1대</td><td>오늘 10:04</td></tr><tr><td>건축전문가 / 전문가</td><td>EXPERT-ARCH-01</td><td><span class="status s-progress">활성</span></td><td>iPhone 1대</td><td>오늘 10:20</td></tr></tbody></table></div>${state.inviteIssued?`<div class="card section-gap"><h3>방금 발급한 초대코드</h3><div style="display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center"><div style="width:120px;height:120px;border:8px solid #111;background:repeating-linear-gradient(45deg,#111 0 6px,#fff 6px 12px);display:grid;place-items:center;color:#2563eb;font-weight:900;background-color:#fff">QR</div><div><div class="muted">완주군 기숙사 담당자</div><div style="font-size:30px;font-weight:900;letter-spacing:.12em;margin:6px 0">WJ-7K2P</div><div class="muted">1회 사용 · 24시간 후 만료</div><div style="margin-top:10px"><button class="btn btn-primary btn-small" onclick="simulateJoin()">휴대폰 가입 흐름 시연</button></div></div></div></div>`:''}`}
function renderFAQ(){const candidate=state.completed?`<tr><td><input type="checkbox" checked></td><td>2026-0013</td><td>완주군</td><td>설계</td><td>피난동선, 계단</td><td><button class="btn btn-primary btn-small" onclick="openFaqEditor()">검토</button></td></tr>`:'';return pageHeader('FAQ 후보함','반복 상담과 전문가 추천사례를 검토·비식별화 후 공유 FAQ로 전환')+`<div class="card"><table class="table"><thead><tr><th></th><th>상담번호</th><th>지역</th><th>유형</th><th>주요 태그</th><th>처리</th></tr></thead><tbody>${candidate}<tr><td><input type="checkbox"></td><td>2026-0008</td><td>고령군</td><td>설계</td><td>소방, 계단</td><td><button class="btn btn-secondary btn-small">검토</button></td></tr></tbody></table></div>${state.faqPublished?'<div class="notice section-gap">FAQ “2층 기숙사 피난동선과 계단 검토 시 확인사항”이 지식DB에 게시되었습니다.</div>':''}`}
function renderOfficerHome(){return pageHeader('상담 목록','완주군 기숙사 담당자 좌석계정',`<button class="btn btn-primary" onclick="navigate('officer-new')">새 상담</button>`)+`<div class="phone-wrap"><div class="phone"><div class="phone-top"></div><div class="phone-screen"><div class="mobile-head"><strong>상담</strong><span>🔔 ${state.notifications.officer}</span></div><div class="mobile-body mobile-list">${state.consultationCreated?`<div class="chat-item" onclick="navigate('officer-chat')"><div class="top"><div class="title">2층 피난동선·계단 검토</div><span class="status ${state.completed?'s-done':'s-progress'}">${state.completed?'완료':'진행 중'}</span></div><div class="preview">${state.messages[state.messages.length-1].text}</div></div>`:''}<div class="chat-item"><div class="top"><div class="title">공사비 조정 가능 범위 문의</div><span class="status s-done">완료</span></div><div class="preview">변경계약 가능 여부와 증빙자료를 안내드립니다.</div></div><div class="chat-item"><div class="top"><div class="title">소방시설 설치범위 확인</div><span class="status s-wait">답변대기</span></div><div class="preview">첨부 도면 기준 검토 요청드립니다.</div></div></div></div></div><button class="fab" onclick="navigate('officer-new')">＋</button></div>`}
function renderOfficerNew(){return pageHeader('새 상담 등록','상담 등록 전 관련 FAQ를 먼저 확인하고 전문가에게 질문')+`<div class="card"><div class="form-row"><div class="field"><label>사업장</label><select id="site"><option>완주 외국인근로자 기숙사</option></select></div><div class="field"><label>상담유형</label><select id="type"><option>설계</option><option>행정절차</option><option>계약·시공</option><option>사업비</option><option>준공·인계</option></select></div></div><div class="field"><label>상담 제목</label><input id="title" value="2층 피난동선·계단 검토" /></div><div class="field"><label>문의내용</label><textarea id="body">기숙사 리모델링 설계안에서 2층 피난동선과 계단 폭이 적정한지 검토 부탁드립니다. 현장 사진도 함께 첨부합니다.</textarea></div><div class="field"><label>첨부파일</label><div class="btn btn-ghost" style="display:inline-block">📎 현장사진_계단.jpg</div></div><div class="faq-suggest"><strong>등록 전 확인할 수 있는 관련 FAQ</strong><div class="faq-item">2층 숙소 계단 설치 시 주요 검토사항 <span class="pill">계단</span><span class="pill">피난</span></div><div class="faq-item">기존 건축물 리모델링 시 소방 관련 확인사항 <span class="pill">소방</span></div></div><div class="danger-note">근로자·제3자의 이름, 연락처 등 개인정보는 상담내용에 입력하지 마세요.</div><div style="margin-top:14px;text-align:right"><button class="btn btn-secondary" onclick="navigate('officer-home')">취소</button> <button class="btn btn-primary" onclick="createConsultation()">상담 등록</button></div></div>`}
function chatHTML(me){return state.messages.map((m,i)=>`<div class="msg ${m.who===me?'me':''}"><div class="bubble-wrap"><div class="sender">${m.name}</div><div class="bubble">${m.text}${m.file?`<div class="attach-card">🖼️ ${m.file}</div>`:''}</div><div class="meta">${m.time} ${m.who===me?'· 읽음':''}</div></div></div>${i===1&&!state.completed?'<div class="system">전문가가 “추가자료 필요”로 상태를 변경했습니다.</div>':''}`).join('')}
function renderChat(role){const me=role==='officer'?'officer':'expert';const head=role==='officer'?'건축전문가 김OO':'완주군 기숙사 담당자';const tools=role==='expert'?`<div class="toolrow"><button class="btn btn-ghost btn-small">태그: 피난동선</button><button class="btn btn-ghost btn-small">태그: 계단</button><button class="btn btn-ghost btn-small" onclick="showToast('현장점검 필요로 표시했습니다.')">현장점검 필요</button><button class="btn btn-primary btn-small" onclick="completeConsultation()">상담 완료·FAQ 추천</button></div>`:'';return pageHeader('상담 채팅방',role==='officer'?'상담번호 2026-0013 · 완주 외국인근로자 기숙사':'배정 상담 · 전문가 도구 사용 가능')+`<div class="chat-shell"><div class="chat-list"><div class="chat-list-header"><strong>${role==='officer'?'내 상담':'배정 상담'}</strong></div><div class="chat-item active"><div class="top"><div class="title">2층 피난동선·계단 검토</div>${state.completed?'<span class="status s-done">완료</span>':'<span class="status s-progress">진행 중</span>'}</div><div class="preview">${state.messages[state.messages.length-1].text}</div></div><div class="chat-item"><div class="title">공사비 조정 가능 범위 문의</div><div class="preview">완료된 상담입니다.</div></div></div><div class="chat-room"><div class="chat-head"><div><strong>${head}</strong><div class="chat-meta">설계 · 완주 외국인근로자 기숙사 · ${state.completed?'완료':'진행 중'}</div></div><span>${state.completed?'🔒':'● 실시간'}</span></div><div class="messages"><div class="date-sep">2026년 10월 25일</div>${chatHTML(me)}</div>${tools}${state.completed?'<div class="notice" style="margin:10px">완료된 상담은 읽기 전용입니다. 전문가 또는 관리자가 재오픈할 수 있습니다.</div>':`<div class="inputbar"><button class="btn btn-ghost">＋</button><input id="chatInput" placeholder="메시지를 입력하세요" value="${role==='officer'&&!state.followup?'평면도를 추가로 첨부했습니다. 피난동선 기준으로 다시 확인 부탁드립니다.':''}"><button class="btn btn-primary" onclick="sendMessage('${role}')">전송</button></div>`}</div></div>`}
function renderExpertHome(){return pageHeader('배정 상담','신규·답변대기·진행중 상담을 우선 처리')+`<div class="grid-4"><div class="stat"><div class="label">신규</div><div class="value">${state.consultationCreated&&!state.completed?1:0}</div></div><div class="stat"><div class="label">답변 대기</div><div class="value">1</div></div><div class="stat"><div class="label">진행 중</div><div class="value">${state.completed?1:2}</div></div><div class="stat"><div class="label">완료</div><div class="value">8</div></div></div><div class="card section-gap"><table class="table"><thead><tr><th>상담번호</th><th>지역</th><th>제목</th><th>유형</th><th>상태</th><th></th></tr></thead><tbody>${state.consultationCreated?`<tr><td>2026-0013</td><td>완주군</td><td>2층 피난동선·계단 검토</td><td>설계</td><td><span class="status ${state.completed?'s-done':'s-new'}">${state.completed?'완료':'신규'}</span></td><td><button class="btn btn-primary btn-small" onclick="navigate('expert-chat')">열기</button></td></tr>`:''}<tr><td>2026-0011</td><td>고령군</td><td>증축부 안전조치 검토</td><td>계약·시공</td><td><span class="status s-wait">답변대기</span></td><td><button class="btn btn-secondary btn-small">열기</button></td></tr></tbody></table></div>`}
function renderAll(){renderMenu();const pages={
 'admin-dashboard':renderAdminDashboard(),'admin-invites':renderInvites(),'admin-faq':renderFAQ(),'officer-home':renderOfficerHome(),'officer-new':renderOfficerNew(),'officer-chat':renderChat('officer'),'expert-home':renderExpertHome(),'expert-chat':renderChat('expert')};
 for(const [id,html] of Object.entries(pages)){const el=document.getElementById(id);el.innerHTML=html;el.classList.toggle('active',state.activePage===id)} }
function issueInvite(){state.inviteIssued=true;renderAll();showToast('완주군 담당자용 초대코드를 발급했습니다.')}
function simulateJoin(){document.getElementById('overlay').classList.add('show');document.getElementById('modal').innerHTML=`<h2>휴대폰 가입 시연</h2><div class="steps"><div class="step active">1 초대코드</div><div class="step active">2 PIN 설정</div><div class="step active">3 관리자 승인</div><div class="step">4 이용 시작</div></div><div class="field"><label>조직 좌석</label><input value="완주군 기숙사 담당자" disabled></div><div class="field"><label>6자리 PIN</label><input value="● ● ● ● ● ●" disabled></div><div class="notice">개인 이름·전화번호를 입력하지 않고 조직 좌석계정으로 가입하는 흐름입니다.</div><div style="text-align:right;margin-top:14px"><button class="btn btn-primary" onclick="approveJoin()">관리자 승인</button></div>`}
function approveJoin(){document.getElementById('modal').innerHTML=`<h2>승인 완료</h2><div class="notice">완주군 담당자 기기가 승인되었습니다. 이제 PIN으로 접속할 수 있습니다.</div><div style="text-align:right;margin-top:14px"><button class="btn btn-primary" onclick="closeModal();setRole('officer')">담당자 화면 보기</button></div>`}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
function createConsultation(){state.consultationCreated=true;state.notifications.expert=1;state.activePage='officer-chat';renderAll();showToast('상담이 등록되었고 전문가에게 알림이 발송되었습니다.')}
function sendMessage(role){const inp=document.getElementById('chatInput');if(!inp||!inp.value.trim())return;state.messages.push({who:role==='officer'?'officer':'expert',name:role==='officer'?'완주군 기숙사 담당자':'건축전문가 김OO',text:inp.value.trim(),time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});if(role==='officer'){state.followup=true;state.notifications.expert++}else{state.notifications.officer++}renderAll();showToast(role==='officer'?'추가질문을 전송했습니다.':'답변을 전송했습니다.')}
function completeConsultation(){state.completed=true;state.notifications.admin++;renderAll();showToast('상담 완료 및 FAQ 후보 추천 처리되었습니다.')}
function openFaqEditor(){document.getElementById('overlay').classList.add('show');document.getElementById('modal').innerHTML=`<h2>FAQ 후보 검토</h2><div class="field"><label>통합 질문</label><input value="2층 기숙사 피난동선과 계단 검토 시 확인사항은 무엇인가요?"></div><div class="field"><label>통합 답변</label><textarea>2층 기숙사 리모델링 시에는 피난동선, 계단 유효폭, 출입구 방향, 소방 관련 기준을 함께 확인하고 평면도와 현장여건을 종합 검토해야 합니다.</textarea></div><div class="field"><label>비식별 체크리스트</label><div><label><input type="checkbox" checked> 지자체명 삭제</label><br><label><input type="checkbox" checked> 사업장명 삭제</label><br><label><input type="checkbox" checked> 주소·개인명 삭제</label><br><label><input type="checkbox" checked> 첨부사진 비공개</label></div></div><div style="text-align:right"><button class="btn btn-secondary" onclick="closeModal()">취소</button> <button class="btn btn-primary" onclick="publishFaq()">FAQ 게시</button></div>`}
function publishFaq(){state.faqPublished=true;closeModal();renderAll();showToast('비식별 검토 후 FAQ를 게시했습니다.')}
function exportDemo(){showToast('데모에서는 Excel 다운로드 동작만 시연합니다.')}
function showDemoGuide(){document.getElementById('overlay').classList.add('show');document.getElementById('modal').innerHTML=`<h2>5분 데모 시나리오</h2><ol style="line-height:1.9"><li>관리자 → 계정·초대 관리 → 초대코드 발급</li><li>휴대폰 가입 흐름 시연 → 관리자 승인 → 담당자 화면</li><li>담당자 → 새 상담 등록 → 현장사진 첨부 → 상담 등록</li><li>상단 역할 전환 → 건축전문가 → 상담 열기 → 답변/태그/현장점검</li><li>담당자 화면으로 전환 → 추가질문 전송</li><li>전문가 → 상담 완료·FAQ 추천</li><li>관리자 → FAQ 후보함 → 검토 → 비식별 체크 → 게시</li><li>관리자 → 대시보드에서 통계 변화 확인</li></ol><div class="notice">이 파일은 서버·개인정보 없이 화면 흐름을 검증하는 1단계 클릭형 프로토타입입니다.</div><div style="text-align:right;margin-top:14px"><button class="btn btn-primary" onclick="closeModal()">시작</button></div>`}
document.getElementById('roleSwitch').addEventListener('click',e=>{if(e.target.dataset.role)setRole(e.target.dataset.role)});document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
renderAll();
</script>
</body>
</html>
