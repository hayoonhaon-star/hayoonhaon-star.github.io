<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>기숙사 전문가 상담 플랫폼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: 공공기관 업무 시스템 셸 — PC는 좌측 메뉴+본문, 휴대폰은 상단바+하단 탭, 상담방은 메신저형 전체 화면 */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8FAFD; --line:#DCE2EC; --line-strong:#C5CEDC;
  --fg:#18202E; --muted:#5A6577; --faint:#8A94A6;
  --accent:#1F4E9E; --accent-strong:#163C7C; --accent-weak:#E8EEF9; --on-accent:#FFFFFF;
  --me:#1F4E9E; --me-fg:#FFFFFF; --other:#FFFFFF; --other-fg:#18202E; --room-bg:#E9EEF5;
  --ok:#1B7A4B; --ok-weak:#E3F3EA; --warn:#A35F00; --warn-weak:#FBF0DD; --crit:#B8372B; --crit-weak:#FBE7E4; --new:#5B43B5; --new-weak:#EEEAFB;
  --demo:#A35F00;
  --shadow:0 1px 2px rgba(20,35,60,.06),0 4px 16px rgba(20,35,60,.06);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --surface-2:#1A2230; --line:#2A3445; --line-strong:#38445A;
  --fg:#E5EAF2; --muted:#9BA6B8; --faint:#6F7A8D;
  --accent:#7EA6EE; --accent-strong:#A9C4F5; --accent-weak:#1C2B45; --on-accent:#0E131B;
  --me:#2F5BAA; --me-fg:#F2F6FD; --other:#1F2836; --other-fg:#E5EAF2; --room-bg:#111823;
  --ok:#5CC68E; --ok-weak:#16301F; --warn:#E3A54A; --warn-weak:#33260F; --crit:#EE7F72; --crit-weak:#3A1A17; --new:#A995F2; --new-weak:#271F44;
  --demo:#E3A54A; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1A2230; --line:#2A3445; --line-strong:#38445A;
  --fg:#E5EAF2; --muted:#9BA6B8; --faint:#6F7A8D;
  --accent:#7EA6EE; --accent-strong:#A9C4F5; --accent-weak:#1C2B45; --on-accent:#0E131B;
  --me:#2F5BAA; --me-fg:#F2F6FD; --other:#1F2836; --other-fg:#E5EAF2; --room-bg:#111823;
  --ok:#5CC68E; --ok-weak:#16301F; --warn:#E3A54A; --warn-weak:#33260F; --crit:#EE7F72; --crit-weak:#3A1A17; --new:#A995F2; --new-weak:#271F44;
  --demo:#E3A54A; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{text-wrap:balance;margin:0}
.badge[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
#app{height:100%}
.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--demo);border:1px solid var(--demo);border-radius:4px;padding:1px 6px;flex:none}
.spacer{flex:1}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:36px;min-width:36px;display:inline-grid;place-items:center;padding:0 8px}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--crit);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.seatchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;max-width:240px}
.seatchip .av{width:28px;height:28px;font-size:11px}
.seatchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--accent-weak);color:var(--accent-strong)}
.av.expert{background:var(--ok-weak);color:var(--ok)}
.av.admin{background:var(--accent);color:var(--on-accent)}
.sidenav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.navlink{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.navlink svg{width:18px;height:18px;flex:none}
.navlink:hover{background:var(--surface-2);color:var(--fg)}
.navlink.on{background:var(--accent-weak);color:var(--accent-strong);font-weight:600}
.navlink .cnt{margin-left:auto;font-size:11.5px;background:var(--crit);color:#fff;border-radius:999px;padding:0 7px}
.navsep{height:1px;background:var(--line);margin:10px 6px}
.navnote{font-size:11.5px;color:var(--faint);padding:8px 12px;line-height:1.5}
main{overflow:auto;min-width:0;position:relative}
.page{max-width:1120px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidenav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar .navlink{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;border-radius:0;align-items:center}
  .tabbar .navlink .cnt{position:absolute;margin:0;transform:translate(14px,-4px)}
  .tabbar .navlink{position:relative}
  main{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .app.in-room .tabbar,.app.in-room .topbar{display:none}
  .app.in-room{grid-template-rows:minmax(0,1fr)}
  .app.in-room main{padding-bottom:0}
  .brand-txt small{display:none}
  .seatchip span{display:none}
  .seatchip{padding:3px}
}

/* common */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:600}
.card-b{padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.st-new{background:var(--new-weak);color:var(--new)}
.st-await{background:var(--warn-weak);color:var(--warn)}
.st-progress{background:var(--accent-weak);color:var(--accent-strong)}
.st-done{background:var(--ok-weak);color:var(--ok)}
.st-overdue{background:var(--crit-weak);color:var(--crit)}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
button.tag{cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;box-sizing:border-box;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:14.5px}
textarea.input{resize:vertical;min-height:96px;line-height:1.55}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--faint)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.banner.warn{background:var(--warn-weak);border-color:transparent;color:var(--fg)}
.banner.info{background:var(--accent-weak);border-color:transparent}
.banner b{white-space:nowrap}

/* consult list */
.clist{display:flex;flex-direction:column}
.citem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 16px}
.citem:last-child{border-bottom:0}
.citem:hover{background:var(--surface-2)}
.cmain{flex:1;min-width:0}
.crow1{display:flex;gap:8px;align-items:baseline}
.crow1 b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow1 time{font-size:12px;color:var(--faint);flex:none}
.crow2{font-size:12.5px;color:var(--muted);margin-top:1px}
.cprev{font-size:13.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.unread{width:9px;height:9px;border-radius:50%;background:var(--crit)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px}
.count b{font-size:20px;font-variant-numeric:tabular-nums}
.count span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent-strong);border-bottom-color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:var(--shadow);border-radius:999px;padding:12px 18px}
@media (max-width:820px){.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

/* room */
.room{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--room-bg)}
.room-head{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
@media (max-width:820px){.room-head{padding-top:calc(10px + env(safe-area-inset-top,0px))}}
.room-head .t{flex:1;min-width:0}
.room-head .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-head .t .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted);align-items:center}
.room-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.msgs{overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.tools{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.tools h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sheet-close{display:none}
@media (max-width:980px){
  .room-body{grid-template-columns:minmax(0,1fr)}
  .tools{position:fixed;left:0;right:0;bottom:0;max-height:78%;z-index:40;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease}
  .tools.open{transform:none}
  .sheet-close{display:inline-flex;align-self:flex-end}
}
@media (prefers-reduced-motion:reduce){.tools{transition:none}}
.datesep{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin:10px 0 4px}
.sys{align-self:center;max-width:90%;text-align:center;font-size:12.5px;color:var(--muted);padding:2px 8px}
.sys b{color:var(--fg);font-weight:600}
.m{display:flex;gap:8px;max-width:min(78%,620px);align-items:flex-end}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .av{width:32px;height:32px;font-size:11px;align-self:flex-start}
.m.me .av{display:none}
.m .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.m .who em{font-style:normal;color:var(--faint);margin-left:4px}
.bub{background:var(--other);color:var(--other-fg);border-radius:4px 14px 14px 14px;padding:9px 13px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(20,35,60,.06);font-size:14.5px}
.m.me .bub{background:var(--me);color:var(--me-fg);border-radius:14px 4px 14px 14px}
.m.cont .av{visibility:hidden}
.mmeta{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:11px;color:var(--faint);flex:none;padding-bottom:2px}
.m:not(.me) .mmeta{align-items:flex-start}
.mmeta .rd{color:var(--accent);font-weight:600}
.mmeta .ur{color:var(--warn);font-weight:700}
.files{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.thumb{display:block;max-width:240px;border-radius:8px;border:1px solid var(--line)}
.fcard{display:flex;gap:8px;align-items:center;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.fcard svg{width:16px;height:16px;flex:none}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.composer .note{font-size:11.5px;color:var(--faint)}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line-strong);border-radius:20px;padding:9px 14px;max-height:140px;min-height:40px;box-sizing:border-box;background:var(--surface);line-height:1.45}
.comp-row .iconbtn{border-radius:50%;height:40px;width:40px;flex:none;padding:0}
.sendbtn{border-radius:50%;height:40px;width:40px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.sendbtn svg{width:18px;height:18px}
.sendbtn:disabled{opacity:.4}
.pending-files{display:flex;gap:6px;flex-wrap:wrap}
.pending-files .tag button{border:0;background:none;padding:0 0 0 4px;color:var(--muted)}
.closed-note{text-align:center;color:var(--muted);font-size:13px;padding:8px}

/* toast */
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(10,20,40,.18);padding:11px 14px;cursor:pointer;animation:tin .25s ease}
.toast .ti{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.toast b{display:block;font-size:13.5px}
.toast span{font-size:12.5px;color:var(--muted)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* login */
.login{min-height:100%;display:flex;justify-content:center;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.login-in{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:860px){.login-in{grid-template-columns:minmax(0,1fr)}.login-in>div:last-child{order:-1}.flow{display:none}}
@media (min-width:981px){.room-head [data-act="toggle-tools"]{display:none}}
.login-hero{padding:6px 2px}
.login-hero .eyebrow{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:700}
.login-hero h1{font-size:25px;line-height:1.35;margin-top:8px;letter-spacing:-.015em}

async function doJoin(){
  var code=($('#jcode')||{}).value; code=(code||'').toUpperCase();var inv=S.invites[code];
  var p1=$('#jpin1').value,p2=$('#jpin2').value,err=$('#joinErr');
  if(!/^\d{6}$/.test(p1)){err.textContent='PIN은 숫자 6자리로 입력해 주세요.';return}
  if(p1!==p2){err.textContent='PIN 확인이 일치하지 않습니다.';return}
  if(/^(\d)\1{5}$/.test(p1)||p1==='123456'&&false){err.textContent='같은 숫자 반복은 사용할 수 없습니다.';return}
  if(!inv||inv.used||inv.revoked){err.textContent='사용할 수 없는 초대코드입니다.';return}
  var base=inv.org||'expert';var n=1;while(S.seats[base+'-'+pad(n)])n++;var id=base+'-'+pad(n);
  var seat={loginId:id,role:inv.role,name:inv.seatName,org:inv.org,status:'pending',pinHash:pinHash(id,p1),devices:[DEVICE],strictDevice:true,failCount:0,demo:false,createdAt:Date.now(),invite:code};
  try{
    await Store.set('seats',id,seat);
    await Store.update('invites',code,{used:true,usedBy:id,usedAt:Date.now()});
    await notify(adminIds(),'join','새 가입 요청이 있습니다',inv.seatName+' · 초대코드 '+code,null);
    LS.set('epis-devseat',id);S.ui.pendingSeat=id;S.ui.join=null;S.ui.loginTab='login';S.ui.joinCode=null;
    View.login.render();
  }catch(e){fail(e)}
}
async function tryPin(){
  var L=View.login, s=S.seats[S.ui.loginId];if(!s)return;
  if(pinHash(s.id,L.pin)===s.pinHash){
    if(s.strictDevice&&s.devices.indexOf(DEVICE)<0){
      var req=(s.devReq||[]).concat([DEVICE]);await Store.update('seats',s.id,{devReq:req,failCount:0}).catch(fail);
      await notify(adminIds(),'device','새 기기 접속 승인 요청',s.name,null);
      S.ui.pendingSeat=s.id;L.pin='';L.render();return;
    }
    if(s.status==='pending'){S.ui.pendingSeat=s.id;L.pin='';L.render();return}
    if(s.failCount)Store.update('seats',s.id,{failCount:0}).catch(function(){});
    S.me=s.id;LS.set('epis-session',s.id);LS.set('epis-devseat',s.id);S.ui.loginId='';L.pin='';S.view=s.role==='admin'?'dash':'home';S.bootAt=Date.now()-1;
    myNotifs().forEach(function(n){S.seenNotif[n.id]=1});
    render();
  } else {
    var f=(s.failCount||0)+1;var upd={failCount:f};if(f>=5)upd.status='locked';
    await Store.update('seats',s.id,upd).catch(function(){});
    if(f>=5)notify(adminIds(),'device','PIN 오류로 계정이 잠겼습니다',s.name,null);
    L.pin='';var b=$('#pinbox');if(b)$$('i',b).forEach(function(i){i.className=''});var e=$('#pinErr');if(e)e.textContent=f>=5?'계정이 잠겼습니다.':'PIN이 맞지 않습니다. ('+f+'/5)';
  }
}

function debounce(f,ms){var t;return function(){var a=arguments;clearTimeout(t);t=setTimeout(function(){f.apply(null,a)},ms)}}
function scoreFaq(text,f){if(!text||text.length<4)return 0;var s=0;(f.tags||[]).forEach(function(t){var k=t.replace(/\(.*\)/,'');if(text.indexOf(k)>=0)s+=3});var words=f.q.split(/[\s,.?·]+/).filter(function(w){return w.length>=2});words.forEach(function(w){if(text.indexOf(w)>=0)s+=1});return s}
function relatedFaqHtml(text){var list=arr(S.faqs).map(function(f){return [scoreFaq(text,f),f]}).filter(function(x){return x[0]>=3}).sort(function(a,b){return b[0]-a[0]}).slice(0,3);if(!list.length)return '';return '<div class="banner info" style="flex-direction:column;gap:6px"><b>등록 전에 확인해 보세요 · 관련 FAQ '+list.length+'건</b>'+list.map(function(x){return '<details><summary style="cursor:pointer">'+esc(x[1].q)+'</summary><div style="white-space:pre-wrap;padding:6px 0 4px 14px;font-size:13.5px">'+esc(x[1].a)+'</div></details>'}).join('')+'</div>'}
function readFiles(fl){var arrF=Array.prototype.slice.call(fl||[]).slice(0,4);return Promise.all(arrF.map(function(f){return new Promise(function(res){
  if(/^image\//.test(f.type)){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var max=480,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);var d='';try{d=c.toDataURL('image/jpeg',.6)}catch(e){}res({name:f.name,size:f.size,kind:'image',thumb:d.length<90000?d:''})};img.onerror=function(){res({name:f.name,size:f.size,kind:'image'})};img.src=r.result};r.onerror=function(){res({name:f.name,size:f.size,kind:'file'})};r.readAsDataURL(f)}
  else res({name:f.name,size:f.size,kind:'file'})})}))}

async function submitConsult(btn){
  var m=me(),v=View.new;var title=$('#nTitle').value.trim(),body=$('#nBody').value.trim();
  if(!title||!body){toast('제목과 문의 내용을 입력해 주세요','두 항목은 필수입니다.');return}
  btn.disabled=true;
  var now=Date.now(),site=$('#nSite').value,org=m.org,expert=EXPERT_FOR_ORG[org]||'expert-01';
  var id='c'+now.toString(36)+rid(3);var yr=new Date().getFullYear();var no=yr+'-'+String(arr(S.consults).filter(function(c){return (c.no||'').indexOf(yr+'-')===0}).length+1).padStart(4,'0');
  var vis=($('input[name=nVis]:checked')||{}).value||'private';
  var readAt={};readAt[m.id]=now;
  var c={no:no,org:org,site:site,officer:m.id,expert:expert,type:$('#nType').value,tags:[],title:title,vis:vis==='shared'?'request':'private',status:'new',createdAt:now,firstAnswerAt:null,lastAnswerAt:null,lastMsgAt:now,lastMsgBy:m.id,lastMsgPreview:body.slice(0,80),lastOfficerMsgAt:now,opinion:'',actions:'',onsite:false,faqCand:null,faqId:null,doneAt:null,readAt:readAt,overdueNotified:false,attachCount:v.files.length};
  try{
    await Store.set('consults',id,c);
    S.consults[id]=Object.assign({id:id},c);
    await Store.set('consults/'+id+'/msgs','m'+now.toString(36),{by:m.id,role:'officer',text:body,at:now,files:v.files});
    await Store.set('consults/'+id+'/msgs','s'+(now+1).toString(36),{by:'system',role:'system',sys:true,text:seatName(expert)+'에게 배정되었습니다.',at:now+1,files:[]});
    await notify(expert,'new','새 상담이 등록되었습니다',ORGS[org].name+' · '+c.type+' · '+title,id);
    toast('상담이 등록되었습니다',seatName(expert)+'에게 알림을 보냈습니다.',null,'완료');
    go('room',id);
  }catch(e){btn.disabled=false;fail(e)}
}

async function downloadCsv(){
  var head=['상담번호','등록일시','지자체','사업장','등록계정','전문가','상담유형','키워드','제목','공개범위','처리상태','지연여부','첫답변일시','최종답변일시','첫답변소요(시간)','자문의견','후속조치','현장점검','완료일시','FAQ반영'];
  var rows=arr(S.consults).sort(function(a,b){return a.createdAt-b.createdAt}).map(function(c){return [c.no,fmtDT(c.createdAt),ORGS[c.org].name,(SITES[c.site]||{}).name,seatName(c.officer),seatName(c.expert),c.type,(c.tags||[]).join('/'),c.title,c.vis==='shared'?'내부공유':'비공개',STATUS[c.status].l,isOverdue(c)?'Y':'N',c.firstAnswerAt?fmtDT(c.firstAnswerAt):'',c.lastAnswerAt?fmtDT(c.lastAnswerAt):'',c.firstAnswerAt?((c.firstAnswerAt-c.createdAt)/36e5).toFixed(1):'',c.opinion,c.actions,c.onsite?'Y':'N',c.doneAt?fmtDT(c.doneAt):'',c.faqId?'Y':'N']});
  var csv='﻿'+[head].concat(rows).map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');
  var dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){toast('이 화면에서는 내려받기를 지원하지 않습니다','claude.ai에서 링크를 열면 내려받을 수 있습니다.');return}
  try{await dl.save({filename:'기숙사_전문가상담_이력_'+fmtD(Date.now()).replace(/\./g,'')+'.csv',data:csv})}catch(e){if(e&&e.code!=='declined'&&e.code!=='cancelled')toast('내려받지 못했습니다',e&&e.message||'')}
}

/* dashboard */
View.dash={
  mount:function(el){this.el=el;this.render();this.checkOverdue()},
  update:function(){this.render()},
  checkOverdue:function(){var ids=adminIds();arr(S.consults).filter(function(c){return isOverdue(c)&&!c.overdueNotified}).forEach(function(c){Store.update('consults',c.id,{overdueNotified:true}).then(function(){notify(ids.concat([c.expert]),'overdue','답변 지연 상담이 있습니다',ORGS[c.org].name+' · '+c.title,c.id)}).catch(function(){})})},
  render:function(){
    var all=arr(S.consults),n=all.length;
    var st={new:0,await:0,progress:0,done:0};all.forEach(function(c){st[c.status]++});
    var over=all.filter(isOverdue);
    var fa=all.filter(function(c){return c.firstAnswerAt}).map(function(c){return (c.firstAnswerAt-c.createdAt)/36e5});
    var avgFa=fa.length?fa.reduce(function(a,b){return a+b},0)/fa.length:0;
    var dn=all.filter(function(c){return c.doneAt}).map(function(c){return (c.doneAt-c.createdAt)/864e5});
    var avgDn=dn.length?dn.reduce(function(a,b){return a+b},0)/dn.length:0;
    var onsite=all.filter(function(c){return c.onsite}).length;
    var cands=all.filter(function(c){return c.faqCand&&!c.faqId}).length;
    function count(key){var m={};all.forEach(function(c){var ks=key(c);(Array.isArray(ks)?ks:[ks]).forEach(function(k){m[k]=(m[k]||0)+1})});return m}
    var byOrg=count(function(c){return ORGS[c.org].name});var byType=count(function(c){return c.type});var byTag=count(function(c){return c.tags||[]});
    function bars(m,limit){var e=Object.keys(m).map(function(k){return [k,m[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,limit||99);var mx=Math.max.apply(null,e.map(function(x){return x[1]}).concat([1]));return '<div class="bars">'+e.map(function(x){return '<div class="bar"><span class="k" title="'+esc(x[0])+'">'+esc(x[0])+'</span><span class="tr"><span class="fl" style="display:block;width:'+(x[1]/mx*100).toFixed(1)+'%"></span></span><span class="v">'+x[1]+'</span></div>'}).join('')+'</div>'}
    // monthly
    var months=[];var d=new Date();d.setDate(1);d.setHours(0,0,0,0);for(var i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push([x.getFullYear()+'-'+(x.getMonth()+1),(x.getMonth()+1)+'월',0])}
    all.forEach(function(c){var t=new Date(c.createdAt);var k=t.getFullYear()+'-'+(t.getMonth()+1);months.forEach(function(m){if(m[0]===k)m[2]++})});
    var mx=Math.max.apply(null,months.map(function(m){return m[2]}).concat([4]));mx=Math.ceil(mx/2)*2;
    var W=520,Hh=200,pl=28,pb=26,pt=16,cw=(W-pl-10)/6;
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" width="100%" role="img" aria-label="월별 상담 등록 건수">';
    for(var g=0;g<=mx;g+=mx/2){var y=pt+(Hh-pt-pb)*(1-g/mx);svg+='<line class="grid" x1="'+pl+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+g+'</text>'}
    months.forEach(function(m,i){var h=(Hh-pt-pb)*(m[2]/mx),x=pl+i*cw+cw*.25,y=Hh-pb-h;svg+='<rect class="col" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(cw*.5).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/><text class="val" x="'+(x+cw*.25).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+m[2]+'</text><text x="'+(x+cw*.25).toFixed(1)+'" y="'+(Hh-8)+'" text-anchor="middle">'+m[1]+'</text>'});
    svg+='</svg>';
    // cross table
    var topTags=Object.keys(byTag).sort(function(a,b){return byTag[b]-byTag[a]}).slice(0,6);
    var cross='<table class="tbl heat"><thead><tr><th>유형 \\ 키워드</th>'+topTags.map(function(t){return '<th class="n">'+esc(t)+'</th>'}).join('')+'</tr></thead><tbody>'+TYPES.map(function(ty){return '<tr><td>'+ty+'</td>'+topTags.map(function(tg){var v=all.filter(function(c){return c.type===ty&&(c.tags||[]).indexOf(tg)>=0}).length;return '<td class="c" style="'+(v?'background:color-mix(in srgb,var(--accent) '+Math.min(60,v*18)+'%,transparent);'+(v>=3?'color:var(--on-accent);font-weight:700':''):'color:var(--faint)')+'">'+(v||'·')+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';
    var stc=[['new','var(--new)'],['await','var(--warn)'],['progress','var(--accent)'],['done','var(--ok)']];
    this.el.innerHTML='<div class="page"><div class="ph"><div><h1>상담 현황 대시보드</h1><p>기준: '+fmtDT(Date.now())+' · 가상 데이터</p></div><div class="row"><button class="btn" data-act="nav" data-v="all">전체 상담</button><button class="btn" data-act="csv">'+ICON.dl+'엑셀(CSV)</button></div></div>'+
      '<div class="kpis"><div class="kpi"><span>전체 상담</span><b>'+n+'</b><small>건</small></div><div class="kpi"><span>평균 첫 답변 소요</span><b>'+avgFa.toFixed(1)+'</b><small>시간</small></div><div class="kpi"><span>평균 처리 기간 (완료 기준)</span><b>'+avgDn.toFixed(1)+'</b><small>일</small></div><div class="kpi'+(over.length?' alert':'')+'"><span>답변 지연 ('+OVERDUE_BIZDAYS+'영업일 초과)</span><b>'+over.length+'</b><small>건</small></div></div>'+
      '<div class="card"><div class="card-b"><div class="row" style="justify-content:space-between"><b>처리 상태</b><span class="hint">현장점검 연계 '+onsite+'건 · FAQ 후보 '+cands+'건</span></div><div class="statusbar">'+stc.map(function(s){return st[s[0]]?'<span style="flex:'+st[s[0]]+';background:'+s[1]+'" title="'+STATUS[s[0]].l+' '+st[s[0]]+'"></span>':''}).join('')+'</div><div class="legend">'+stc.map(function(s){return '<span><i style="background:'+s[1]+'"></i>'+STATUS[s[0]].l+' <b class="num">'+st[s[0]]+'</b></span>'}).join('')+'</div></div></div>'+
      '<div class="grid2"><div class="card"><div class="card-h"><h2>월별 상담 등록</h2><span class="hint">최근 6개월</span></div><div class="card-b">'+svg+'</div></div><div class="card"><div class="card-h"><h2>답변 지연 상담</h2><span class="hint">관리자·전문가에게 알림 발송</span></div><div class="clist">'+(over.length?over.map(function(c){return '<button class="citem" data-act="open" data-id="'+c.id+'"><div class="cmain"><div class="crow1"><b>'+esc(c.title)+'</b></div><div class="crow2">'+esc(ORGS[c.org].name)+' · '+esc(seatName(c.expert))+' · 마지막 질문 '+ago(c.lastOfficerMsgAt)+'</div></div><div class="cside">'+statusPill(c)+'</div></button>'}).join(''):'<div class="empty">지연된 상담이 없습니다.</div>')+'</div></div></div>'+
      '<div class="grid3"><div class="card"><div class="card-h"><h2>지자체별</h2></div><div class="card-b">'+bars(byOrg)+'</div></div><div class="card"><div class="card-h"><h2>상담유형별</h2></div><div class="card-b">'+bars(byType)+'</div></div><div class="card"><div class="card-h"><h2>상담 내용 키워드 상위</h2><button class="btn sm" data-act="nav" data-v="cands">FAQ 후보함</button></div><div class="card-b">'+bars(byTag,8)+'</div></div></div>'+
      '<div class="card"><div class="card-h"><h2>상담유형 × 내용 키워드</h2><span class="hint">어떤 유형에서 어떤 주제가 반복되는지 봅니다</span></div><div class="tbl-wrap">'+cross+'</div></div></div>';
  }
};

/* FAQ candidates */
View.cands={
  mount:function(el){this.el=el;S.ui.sel=S.ui.sel||{};this.render()},
  update:function(){this.render()},
  render:function(){
    var all=arr(S.consults),sel=S.ui.sel;
    var rec=all.filter(function(c){return c.faqCand&&!c.faqId}).sort(function(a,b){return b.faqCand.at-a.faqCand.at});
    var tagCnt={};all.filter(function(c){return !c.faqId}).forEach(function(c){(c.tags||[]).forEach(function(t){tagCnt[t]=(tagCnt[t]||0)+1})});
    var th=S.ui.tagTh||3;
    var rep=Object.keys(tagCnt).filter(function(t){return tagCnt[t]>=th}).sort(function(a,b){return tagCnt[b]-tagCnt[a]});

    var tagCases=focus?all.filter(function(c){return !c.faqId&&(c.tags||[]).indexOf(focus)>=0}):[];

      '<div class="card"><div class="card-h"><h2>전문가 추천 사례 <span class="num faint">'+rec.length+'</span></h2></div><div class="clist">'+(rec.length?rec.map(row).join(''):'<div class="empty">추천된 사례가 없습니다. 전문가가 상담방의 ‘FAQ 후보로 추천’을 누르면 여기에 모입니다.</div>')+'</div></div>'+
      '<div class="card"><div class="card-h"><h2>반복 문의 키워드</h2><label class="row hint" style="gap:6px">기준 <select class="input" id="tagTh" style="width:auto;padding:4px 8px">'+[2,3,4].map(function(v){return '<option value="'+v+'"'+(v===th?' selected':'')+'>'+v+'건 이상</option>'}).join('')+'</select></label></div><div class="card-b" style="display:flex;flex-wrap:wrap;gap:6px">'+(rep.length?rep.map(function(t){return '<button class="tag'+(focus===t?' on':'')+'" data-act="cand-tag" data-t="'+esc(t)+'">'+esc(t)+' <b class="num" style="margin-left:4px">'+tagCnt[t]+'</b></button>'}).join(''):'<span class="hint">기준 이상 반복된 키워드가 없습니다.</span>')+'</div>'+(focus?'<div class="clist" style="border-top:1px solid var(--line)">'+tagCases.map(row).join('')+'</div>':'')+'</div></div>';
    var self=this;$('#tagTh').addEventListener('change',function(e){S.ui.tagTh=+e.target.value;self.render()});
  }
};
View.faqedit={
  mount:function(el){
    var ids=Object.keys(S.ui.sel||{}).filter(function(k){return S.ui.sel[k]&&S.consults[k]});this.ids=ids;this.el=el;
    if(!ids.length){go('cands');return}
    var cs=ids.map(function(i){return S.consults[i]});
    var tags={};cs.forEach(function(c){(c.tags||[]).forEach(function(t){tags[t]=1})});
    var type=cs[0].type;
    el.innerHTML='<div class="page"><div class="ph"><div><h1>FAQ 작성</h1><p>원본 사례 '+ids.length+'건을 참고해 질문과 답변을 정리합니다. 원본 상담번호는 내부에만 보관되고 담당자에게는 보이지 않습니다.</p></div><button class="btn" data-act="nav" data-v="cands">후보함으로</button></div>'+
      '<div class="grid2" style="align-items:start"><div class="card"><div class="card-h"><h2>원본 사례</h2></div><div class="card-b" id="srcCases" style="display:flex;flex-direction:column;gap:10px"><div class="hint">불러오는 중…</div></div></div>'+
      '<div class="card"><div class="card-h"><h2>FAQ 내용</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">'+
      '<div class="field"><label for="fqType">분류</label><select class="input" id="fqType">'+TYPES.map(function(t){return '<option'+(t===type?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div>'+
      '<div class="field"><label for="fqQ">질문</label><input class="input" id="fqQ" value="'+esc(cs[0].title)+'"></div>'+
      '<div class="field"><label for="fqA">답변</label><textarea class="input" id="fqA" rows="8">'+esc(cs.map(function(c){return c.opinion}).filter(Boolean).join('\n'))+'</textarea><span class="hint">원본 답변을 참고해 일반화된 표현으로 다시 쓰세요.</span></div>'+
      '<div class="field"><span class="lbl">키워드</span><div style="display:flex;flex-wrap:wrap;gap:5px" id="fqTags">'+Object.keys(tags).map(function(t){return '<button class="tag on" data-act="fq-tag" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div></div>'+
      '<div id="detect"></div>'+
      '<div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">비식별 점검 (게시 전 필수)</span>'+['지자체명·사업장명을 삭제했습니다','주소·지번 등 위치 정보를 삭제했습니다','담당자·근로자 등 개인 식별 정보를 삭제했습니다','현장 사진 등 첨부파일을 포함하지 않았습니다'].map(function(t,i){return '<label class="check"><input type="checkbox" class="deid" id="deid'+i+'"> '+t+'</label>'}).join('')+'</div>'+
      '<button class="btn primary" data-act="faq-publish" id="pubBtn" disabled>FAQ 게시</button></div></div></div></div>';
    var self=this;
    ['fqQ','fqA'].forEach(function(i){$('#'+i).addEventListener('input',function(){self.check()})});$$('.deid').forEach(function(x){x.addEventListener('change',function(){self.check()})});
    this.check();
    Promise.all(ids.map(function(i){return Store.list('consults/'+i+'/msgs')})).then(function(res){
      var b=$('#srcCases');if(!b)return;
      b.innerHTML=res.map(function(ms,k){var c=S.consults[ids[k]];ms.sort(function(a,b){return a.at-b.at});return '<div class="case"><div class="row" style="justify-content:space-between"><b>'+esc(c.title)+'</b><span class="mono hint">'+esc(c.no)+'</span></div><div class="hint">'+esc(ORGS[c.org].name)+' · '+esc(c.type)+'</div>'+ms.filter(function(m){return !m.sys}).map(function(m){return '<div class="ln '+(m.role==='expert'?'e':'o')+'"><span class="hint">'+(ROLE[m.role]||'')+'</span><br>'+esc(m.text)+'</div>'}).join('')+'</div>'}).join('');
    });
  },
  check:function(){
    var q=$('#fqQ').value,a=$('#fqA').value,t=q+' '+a,hits=[];
    Object.keys(ORGS).forEach(function(k){var n=ORGS[k].name,s=n.slice(0,2);if(t.indexOf(n)>=0)hits.push(n);else if(new RegExp(s+'(?=\\s|군|시|$)').test(t))hits.push(s)});
    Object.keys(SITES).forEach(function(k){if(t.indexOf(SITES[k].name)>=0)hits.push(SITES[k].name)});
    if(/\d{2,3}-\d{3,4}-\d{4}/.test(t))hits.push('전화번호 형식');
    if(/\d+(-\d+)?번지/.test(t))hits.push('지번');
    $('#detect').innerHTML=hits.length?'<div class="detect"><b>식별 정보로 보이는 표현:</b> '+hits.map(esc).join(', ')+' — 삭제한 뒤 게시할 수 있습니다.</div>':'<div class="ok-note">자동 점검에서 지자체명·사업장명이 발견되지 않았습니다.</div>';
    var allChecked=$$('.deid').every(function(x){return x.checked});
    $('#pubBtn').disabled=!(q.trim()&&a.trim()&&allChecked&&!hits.length);
  }
};
async function publishFaq(){
  var v=View.faqedit,id='f'+Date.now().toString(36);var tags=$$('#fqTags .tag.on').map(function(b){return b.dataset.t});
  var f={q:$('#fqQ').value.trim(),a:$('#fqA').value.trim(),type:$('#fqType').value,tags:tags,sources:v.ids,createdAt:Date.now(),by:me().id};
  try{await Store.set('faqs',id,f);for(var i=0;i<v.ids.length;i++){await Store.update('consults',v.ids[i],{faqId:id})}
    S.ui.sel={};S.ui.candTag=null;toast('FAQ를 게시했습니다','모든 담당자가 FAQ에서 볼 수 있습니다.',null,'완료');go('faq');}catch(e){fail(e)}
}

/* FAQ */
View.faq={
  mount:function(el){this.el=el;this.render()},
  update:function(){this.drawList()},
  render:function(){
    var q=S.ui.faqQ||'';
    this.el.innerHTML='<div class="page" style="max-width:900px"><div class="ph"><div><h1>FAQ · 공유 사례</h1><p>농정원이 검토해 비식별 처리한 상담 사례입니다. 상담을 등록하기 전에 먼저 찾아보세요.</p></div></div>'+
      '<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:10px"><input class="input" id="fq" placeholder="키워드로 검색 (예: 농지전용, 사용승인)" value="'+esc(q)+'"><div style="display:flex;flex-wrap:wrap;gap:5px" id="fcat"></div></div><div id="flist"></div></div>'+
      '<div class="card" id="sharedBox"></div></div>';
    var self=this;$('#fq').addEventListener('input',debounce(function(e){S.ui.faqQ=$('#fq').value.trim();self.drawList()},150));
    this.drawList();

  drawList:function(){

async function resetDemo(){
  var box=$('#resetBox');if(box)box.innerHTML='<span class="hint">초기화하는 중… 잠시만 기다려 주세요.</span>';
  var seed=makeSeed(Date.now());
  try{
    if(Store.mode==='local'){Store.local=seedToLocal(seed);COLS.forEach(function(c){Store._emit(c)});}
    else{
      var cids=Object.keys(S.consults);
      for(var i=0;i<cids.length;i++){var ms=await Store.list('consults/'+cids[i]+'/msgs');await pool(ms.map(function(m){return function(){return Store.del('consults/'+cids[i]+'/msgs',m.id)}}),4)}
      for(var j=0;j<COLS.length;j++){var col=COLS[j];var ids=Object.keys(S[col]);await pool(ids.map(function(id){return function(){return Store.del(col,id)}}),4)}
      var jobs=[];['seats','consults','notices','faqs','invites','notifs'].forEach(function(col){Object.keys(seed[col]).forEach(function(id){jobs.push(function(){return Store.set(col,id,seed[col][id])})})});
      Object.keys(seed.msgs).forEach(function(cid){seed.msgs[cid].forEach(function(m,k){jobs.push(function(){return Store.set('consults/'+cid+'/msgs','m'+String(k).padStart(3,'0'),m)})})});
      await pool(jobs,4);
    }
    S.seenNotif={};S.bootAt=Date.now();LS.del('epis-steps');
    toast('데모 데이터를 초기화했습니다','처음 상태로 돌아갔습니다.',null,'완료');
    S.me='epis-admin';LS.set('epis-session','epis-admin');setTimeout(function(){go('dash')},400);
  }catch(e){fail(e);if(box)box.innerHTML='<button class="btn danger" data-act="reset-ask">다시 시도</button>'}
}
async function pool(jobs,n){var i=0;async function w(){while(i<jobs.length){var j=jobs[i++];await j()}}var ws=[];for(var k=0;k<n;k++)ws.push(w());await Promise.all(ws)}
